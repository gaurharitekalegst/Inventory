<!-- Firebase SDKs (Compat Mode for easy script-tag integration) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
  // 1. YOUR DYNAMIC FIREBASE CONFIGURATION (Filled from your screenshot!)
  const firebaseConfig = {
    apiKey: "AIzaSyCXaFdDhxXqqxbMg9SdXmk0drj_DvhBA3s",
    authDomain: "janmashtami-ledger.firebaseapp.com",
    projectId: "janmashtami-ledger",
    storageBucket: "janmashtami-ledger.firebasestorage.app",
    messagingSenderId: "964836719338",
    appId: "1:964836719338:web:943a7b9697db487b297593"
  };

  // Initialize Firebase modules
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // DOM Elements tracking
  const authWall = document.getElementById('auth-wall');
  const mainDashboard = document.getElementById('main-dashboard');
  const loginForm = document.getElementById('login-form');
  const entryForm = document.getElementById('entry-form');
  const logoutBtn = document.getElementById('logout-btn');

  // ================= 2. AUTHENTICATION CONTROLLER =================
  
  // Monitors user login status shifts
  auth.onAuthStateChanged(user => {
    if (user) {
      authWall.classList.add('hidden');
      mainDashboard.classList.remove('hidden');
      attachLiveDatabaseListeners(); // Starts fetching data once authorized
    } else {
      authWall.classList.remove('hidden');
      mainDashboard.classList.add('hidden');
    }
  });

  // Handle Login submission
  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const pass = document.getElementById('login-password').value;
    
    auth.signInWithEmailAndPassword(email, pass).catch(err => {
      alert("Error logging in: " + err.message);
    });
  });

  // Handle Logout execution
  logoutBtn.addEventListener('click', () => {
    auth.signOut();
  });

  // ================= 3. WRITE CONTEXT DATA TO FIRESTORE =================
  entryForm.addEventListener('submit', (e) => {
    e.preventDefault();

    const newLog = {
      devoteeName: document.getElementById('devotee-name').value.trim(),
      mobileNumber: document.getElementById('devotee-mobile').value.trim(),
      amount: Number(document.getElementById('devotee-amount').value),
      paymentMode: document.getElementById('payment-mode').value,
      utrId: document.getElementById('utr-id').value.trim() || "N/A",
      collectedByGroup: document.getElementById('collecting-group').value.trim(),
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };

    db.collection('contributions').add(newLog)
      .then(() => {
        alert("🎉 Contribution successfully saved to ledger!");
        entryForm.reset();
        document.getElementById('utr-container').classList.add('hidden'); // Reset UPI block visibility
      })
      .catch(err => alert("Error writing entry: " + err.message));
  });

  // ================= 4. REAL-TIME DATA CALCULATIONS =================
  let unsubscribeCollection = null;

  function attachLiveDatabaseListeners() {
    // Prevents building multiple active streaming context pipes
    if(unsubscribeCollection) unsubscribeCollection();

    unsubscribeCollection = db.collection('contributions')
      .orderBy('timestamp', 'desc')
      .onSnapshot(snapshot => {
        const rawDocs = [];
        let groupTallies = {};

        // Empty current presentation outputs
        const tableBody = document.getElementById('register-table-body');
        tableBody.innerHTML = '';
        document.getElementById('total-rows').innerText = `${snapshot.size} Records`;

        if (snapshot.empty) {
          tableBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400 italic">No contribution records exist yet</td></tr>`;
          renderLeaderboards([], {});
          return;
        }

        snapshot.forEach(doc => {
          const data = doc.data();
          rawDocs.push(data);

          // Append to Page 2 Data Table
          const row = document.createElement('tr');
          row.className = "hover:bg-amber-50/50 transition";
          row.innerHTML = `
            <td class="p-4 font-semibold text-amber-900">${data.devoteeName}</td>
            <td class="p-4 text-gray-600">${data.mobileNumber}</td>
            <td class="p-4 font-bold text-emerald-700">₹${data.amount.toLocaleString()}</td>
            <td class="p-4"><span class="px-2 py-0.5 rounded text-xs font-semibold ${data.paymentMode === 'UPI' ? 'bg-blue-100 text-blue-800' : 'bg-orange-100 text-orange-800'}">${data.paymentMode}</span></td>
            <td class="p-4 text-xs font-mono text-gray-500">${data.utrId}</td>
            <td class="p-4 text-gray-700 font-medium">${data.collectedByGroup}</td>
          `;
          tableBody.appendChild(row);

          // Compute operational totals for Group Leaderboard accumulation mapping
          if(data.collectedByGroup) {
            groupTallies[data.collectedByGroup] = (groupTallies[data.collectedByGroup] || 0) + data.amount;
          }
        });

        // Compute and build UI presentation arrays for Leaderboard
        renderLeaderboards(rawDocs, groupTallies);
      }, err => {
        console.error("Firestore listener failure: ", err);
      });
  }

  // ================= 5. RENDER LEADERBOARDS =================
  function renderLeaderboards(docs, groupTallies) {
    // A. Process Top Devotee Contributors (Sorted Descending)
    const sortedDevotees = [...docs].sort((a, b) => b.amount - a.amount).slice(0, 5);
    const donorContainer = document.getElementById('top-donors-list');
    donorContainer.innerHTML = '';
    
    if(sortedDevotees.length === 0) {
      donorContainer.innerHTML = `<p class="text-sm text-gray-400 italic">No contributions entered yet.</p>`;
    } else {
      sortedDevotees.forEach((dev, index) => {
        const row = document.createElement('div');
        row.className = "flex justify-between items-center p-3 bg-amber-50/60 rounded-xl border border-amber-100/50";
        row.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-6 h-6 rounded-full bg-amber-200 text-amber-800 text-xs font-bold flex items-center justify-center">${index + 1}</span>
            <div>
              <p class="font-bold text-amber-950">${dev.devoteeName}</p>
              <p class="text-xs text-gray-500">Collected by: ${dev.collectedByGroup}</p>
            </div>
          </div>
          <span class="font-extrabold text-emerald-700 text-base">₹${dev.amount.toLocaleString()}</span>
        `;
        donorContainer.appendChild(row);
      });
    }

    // B. Process Top Collecting Groups (Sorted Descending)
    const sortedGroups = Object.keys(groupTallies).map(key => ({
      groupName: key,
      totalAmount: groupTallies[key]
    })).sort((a, b) => b.totalAmount - a.totalAmount).slice(0, 5);

    const groupContainer = document.getElementById('top-groups-list');
    groupContainer.innerHTML = '';

    if(sortedGroups.length === 0) {
      groupContainer.innerHTML = `<p class="text-sm text-gray-400 italic">No group tallies calculated yet.</p>`;
    } else {
      sortedGroups.forEach((gp, index) => {
        const row = document.createElement('div');
        row.className = "flex justify-between items-center p-3 bg-amber-50/60 rounded-xl border border-amber-100/50";
        row.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-6 h-6 rounded-full bg-amber-600 text-white text-xs font-bold flex items-center justify-center">${index + 1}</span>
            <span class="font-bold text-amber-950">${gp.groupName}</span>
          </div>
          <span class="font-extrabold text-amber-700 text-base">₹${gp.totalAmount.toLocaleString()}</span>
        `;
        groupContainer.appendChild(row);
      });
    }
  }
</script>
